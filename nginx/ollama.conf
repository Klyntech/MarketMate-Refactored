# =============================================================================
# MarketMate — Nginx Reverse Proxy Configuration (Ollama Stack)
# =============================================================================
# This config fronts the MarketMate API and enforces security policies:
#   - Rate limits the /api/mate endpoint to prevent abuse
#   - Blocks all direct access to Ollama (port 11434 must never be public)
#   - Proxies health checks and API traffic to the backend
# =============================================================================

# ---------------------------------------------------------------------------
# Upstream — MarketMate API backend
# ---------------------------------------------------------------------------
upstream marketmate_api {
    server api:8000;
}

# ---------------------------------------------------------------------------
# Rate-limiting zone — 10 requests/sec per client IP for the Mate endpoint
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=mate_limit:10m rate=10r/s;

# ---------------------------------------------------------------------------
# Server — main entry point on port 80
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # --- Security headers ---------------------------------------------------
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-Frame-Options           "DENY"             always;
    add_header X-XSS-Protection          "1; mode=block"    always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;

    # --- DENY: Block all access to Ollama port 11434 -----------------------
    # Ollama must NEVER be publicly accessible. If Nginx ever receives a
    # request that appears to target Ollama (e.g. via port sniffing or
    # misconfigured upstream), return 403 immediately.
    location ~ ^/(api/tags|api/generate|api/chat|api/pull|api/push|api/show|api/copy|api/delete|api/embeddings|api/ps|api/version) {
        return 403;
    }

    # --- Mate endpoint — rate-limited ---------------------------------------
    location /api/mate {
        limit_req zone=mate_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://marketmate_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / streaming support for LLM responses
        proxy_set_header Connection        '';
        proxy_buffering                    off;
        proxy_cache                        off;
        chunked_transfer_encoding          on;
        proxy_read_timeout                 300s;
    }

    # --- Health check — no rate limit ---------------------------------------
    location /health {
        proxy_pass         http://marketmate_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Default — proxy everything else to API -----------------------------
    location / {
        proxy_pass         http://marketmate_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Allow long-lived connections for streaming
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }

    # --- DENY: Explicit block for Ollama direct access ----------------------
    location /ollama {
        return 403;
    }

    # --- Access & error logs ------------------------------------------------
    access_log /var/log/nginx/marketmate_access.log;
    error_log  /var/log/nginx/marketmate_error.log warn;
}
